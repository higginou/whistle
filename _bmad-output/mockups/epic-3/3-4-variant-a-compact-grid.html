<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story 3-4 — Variante A : Compact Stats Grid</title>
<style>
  :root {
    /* Zone Colors */
    --w-color-europe: #8b5cf6;
    --w-color-top6: #22c55e;
    --w-color-mid: #9ca3af;
    --w-color-relegation: #ef4444;

    /* Dark Functional Palette */
    --w-color-primary: #8b5cf6;
    --w-color-surface: #0f0f14;
    --w-color-surface-elevated: #1a1a24;
    --w-color-surface-card: #22222e;
    --w-color-text-primary: #f0f0f5;
    --w-color-text-secondary: #9ca3af;
    --w-color-text-muted: #6b7280;
    --w-color-success: #22c55e;
    --w-color-danger: #ef4444;
    --w-color-draw: #9ca3af;
    --w-color-muted: #4b5563;
    --w-color-favorite: #ffd700;

    /* Spacing */
    --w-space-xs: 0.25rem;
    --w-space-sm: 0.5rem;
    --w-space-md: 1rem;
    --w-space-lg: 1.5rem;
    --w-space-xl: 2rem;

    /* Typography */
    --w-text-hero: 2rem;
    --w-text-h1: 1.5rem;
    --w-text-h2: 1.25rem;
    --w-text-body: 1rem;
    --w-text-label: 0.875rem;
    --w-text-caption: 0.75rem;

    /* Radius & Shadow */
    --w-radius-card: 12px;
    --w-radius-sheet: 16px;
    --w-shadow-sheet: 0 -4px 24px rgba(0, 0, 0, 0.5);
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html { font-size: 16px; }

  body {
    font-family: "Nunito", system-ui, -apple-system, sans-serif;
    font-size: var(--w-text-body);
    color: var(--w-color-text-primary);
    background: var(--w-color-surface);
    min-height: 100vh;
    min-height: 100dvh;
  }

  /* ===== Demo container ===== */
  .w-demo {
    max-width: 430px;
    margin: 0 auto;
    padding: var(--w-space-xl) var(--w-space-md);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--w-space-lg);
  }

  .w-demo__title {
    font-size: var(--w-text-label);
    color: var(--w-color-text-secondary);
    text-align: center;
  }

  .w-demo__trigger {
    display: flex;
    align-items: center;
    gap: var(--w-space-sm);
    padding: var(--w-space-md) var(--w-space-lg);
    background: var(--w-color-surface-elevated);
    border: 1px solid rgba(139, 92, 246, 0.3);
    border-radius: var(--w-radius-card);
    color: var(--w-color-text-primary);
    font-size: var(--w-text-body);
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.15s ease;
    touch-action: manipulation;
  }

  .w-demo__trigger:active {
    transform: scale(0.97);
  }

  .w-demo__trigger-logo {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--w-color-favorite);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: var(--w-text-caption);
    font-weight: 800;
    color: #1a1a24;
  }

  /* ===== Dialog / Bottom Sheet ===== */
  dialog.w-bottom-sheet {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    top: auto;
    width: 100%;
    max-width: 430px;
    margin: 0 auto;
    border: none;
    padding: 0;
    background: var(--w-color-surface-elevated);
    border-radius: var(--w-radius-sheet) var(--w-radius-sheet) 0 0;
    box-shadow: var(--w-shadow-sheet);
    color: var(--w-color-text-primary);
    overflow: hidden;
    max-height: 90dvh;
    transform: translateY(100%);
    transition: transform 300ms cubic-bezier(0.32, 0.72, 0, 1);
    will-change: transform;
  }

  dialog.w-bottom-sheet[open] {
    transform: translateY(0);
  }

  dialog.w-bottom-sheet.w-bottom-sheet--half {
    transform: translateY(50dvh);
  }

  dialog.w-bottom-sheet.w-bottom-sheet--closing {
    transform: translateY(100%);
    transition-duration: 200ms;
    transition-timing-function: ease-in;
  }

  dialog.w-bottom-sheet::backdrop {
    background: rgba(0, 0, 0, 0);
    animation: w-backdrop-in 300ms ease forwards;
  }

  dialog.w-bottom-sheet.w-bottom-sheet--closing::backdrop {
    animation: w-backdrop-out 200ms ease forwards;
  }

  @keyframes w-backdrop-in {
    from { background: rgba(0, 0, 0, 0); }
    to { background: rgba(0, 0, 0, 0.4); }
  }

  @keyframes w-backdrop-out {
    from { background: rgba(0, 0, 0, 0.4); }
    to { background: rgba(0, 0, 0, 0); }
  }

  /* ===== Handle ===== */
  .w-bottom-sheet__handle {
    display: flex;
    justify-content: center;
    padding: var(--w-space-sm) 0;
    cursor: grab;
    touch-action: none;
  }

  .w-bottom-sheet__handle::after {
    content: "";
    width: 40px;
    height: 4px;
    border-radius: 2px;
    background: var(--w-color-muted);
  }

  /* ===== Close button ===== */
  .w-bottom-sheet__close {
    position: absolute;
    top: var(--w-space-sm);
    right: var(--w-space-sm);
    width: 48px;
    height: 48px;
    border: none;
    background: transparent;
    color: var(--w-color-text-secondary);
    font-size: 1.25rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    touch-action: manipulation;
  }

  .w-bottom-sheet__close:focus-visible {
    outline: 2px solid var(--w-color-primary);
    outline-offset: 2px;
  }

  /* ===== Content scrollable ===== */
  .w-bottom-sheet__content {
    overflow-y: auto;
    padding: 0 var(--w-space-md) var(--w-space-xl);
    max-height: calc(90dvh - 40px);
  }

  /* ===== Header ===== */
  .w-bottom-sheet__header {
    display: flex;
    align-items: center;
    gap: var(--w-space-md);
    padding-bottom: var(--w-space-md);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    margin-bottom: var(--w-space-md);
  }

  .w-bottom-sheet__logo {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: var(--w-text-label);
    font-weight: 800;
    flex-shrink: 0;
  }

  .w-bottom-sheet__team-info {
    flex: 1;
    min-width: 0;
  }

  .w-bottom-sheet__team-name {
    font-size: var(--w-text-h2);
    font-weight: 700;
    line-height: 1.2;
  }

  .w-bottom-sheet__team-ranks {
    font-size: var(--w-text-label);
    color: var(--w-color-text-secondary);
    display: flex;
    align-items: center;
    gap: var(--w-space-xs);
  }

  .w-bottom-sheet__trend {
    font-weight: 700;
  }

  .w-bottom-sheet__trend--up { color: var(--w-color-success); }
  .w-bottom-sheet__trend--down { color: var(--w-color-danger); }
  .w-bottom-sheet__trend--stable { color: var(--w-color-text-muted); }

  /* ===== Stats Grid (2x3) ===== */
  .w-bottom-sheet__stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--w-space-sm);
    margin-bottom: var(--w-space-md);
  }

  .w-bottom-sheet__stat {
    background: var(--w-color-surface-card);
    border-radius: var(--w-radius-card);
    padding: var(--w-space-md);
    display: flex;
    flex-direction: column;
    gap: var(--w-space-xs);
  }

  .w-bottom-sheet__stat-label {
    font-size: var(--w-text-caption);
    color: var(--w-color-text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .w-bottom-sheet__stat-value {
    font-size: var(--w-text-h1);
    font-weight: 800;
    font-feature-settings: "tnum";
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .w-bottom-sheet__stat-sub {
    font-size: var(--w-text-caption);
    color: var(--w-color-text-muted);
  }

  /* ===== Form dots ===== */
  .w-bottom-sheet__form-dots {
    display: flex;
    gap: 6px;
    align-items: center;
    padding-top: var(--w-space-xs);
  }

  .w-bottom-sheet__form-dot {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: var(--w-text-caption);
    font-weight: 800;
    color: #fff;
  }

  .w-bottom-sheet__form-dot--W { background: var(--w-color-success); }
  .w-bottom-sheet__form-dot--L { background: var(--w-color-danger); }
  .w-bottom-sheet__form-dot--D { background: var(--w-color-draw); }

  /* ===== Section label ===== */
  .w-bottom-sheet__section-label {
    font-size: var(--w-text-caption);
    color: var(--w-color-text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: var(--w-space-sm);
  }

  /* ===== Stacked bar (zones) ===== */
  .w-bottom-sheet__zones {
    margin-bottom: var(--w-space-md);
  }

  .w-bottom-sheet__zone-bar {
    display: flex;
    height: 28px;
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: var(--w-space-sm);
  }

  .w-bottom-sheet__zone-segment {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: var(--w-text-caption);
    font-weight: 700;
    color: #fff;
    min-width: 28px;
    transition: flex 0.3s ease;
  }

  .w-bottom-sheet__zone-legend {
    display: flex;
    flex-wrap: wrap;
    gap: var(--w-space-sm) var(--w-space-md);
  }

  .w-bottom-sheet__zone-item {
    display: flex;
    align-items: center;
    gap: var(--w-space-xs);
    font-size: var(--w-text-caption);
    color: var(--w-color-text-secondary);
  }

  .w-bottom-sheet__zone-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ===== Elo gauge ===== */
  .w-bottom-sheet__elo-gauge {
    width: 100%;
    height: 6px;
    background: var(--w-color-surface-card);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 4px;
  }

  .w-bottom-sheet__elo-fill {
    height: 100%;
    border-radius: 3px;
    background: var(--w-color-primary);
    transition: width 0.4s ease;
  }

  /* ===== Reduced motion ===== */
  @media (prefers-reduced-motion: reduce) {
    dialog.w-bottom-sheet,
    dialog.w-bottom-sheet::backdrop {
      transition: none !important;
      animation: none !important;
    }
  }
</style>
</head>
<body>

<div class="w-demo">
  <p class="w-demo__title">Story 3-4 / Variante A : Compact Stats Grid<br>Tap pour ouvrir le bottom sheet</p>

  <button class="w-demo__trigger" id="openBtn" aria-label="Ouvrir la fiche La Rochelle">
    <span class="w-demo__trigger-logo">SR</span>
    <span>4e &mdash; La Rochelle &mdash; Elo 1582</span>
  </button>
</div>

<dialog class="w-bottom-sheet" id="sheet" aria-label="Fiche La Rochelle">
  <div class="w-bottom-sheet__handle" aria-hidden="true"></div>
  <button class="w-bottom-sheet__close" aria-label="Fermer" id="closeBtn">&times;</button>

  <div class="w-bottom-sheet__content">
    <!-- Header -->
    <header class="w-bottom-sheet__header">
      <span class="w-bottom-sheet__logo" style="background: #ffd700; color: #1a1a24;">SR</span>
      <div class="w-bottom-sheet__team-info">
        <div class="w-bottom-sheet__team-name">La Rochelle</div>
        <div class="w-bottom-sheet__team-ranks">
          4e &rarr; 3e
          <span class="w-bottom-sheet__trend w-bottom-sheet__trend--up">&uarr;</span>
        </div>
      </div>
    </header>

    <!-- Stats Grid 2x3 -->
    <div class="w-bottom-sheet__stats-grid">
      <div class="w-bottom-sheet__stat">
        <span class="w-bottom-sheet__stat-label">Position</span>
        <span class="w-bottom-sheet__stat-value">4<sup style="font-size:0.5em">e</sup></span>
      </div>
      <div class="w-bottom-sheet__stat">
        <span class="w-bottom-sheet__stat-label">Projection</span>
        <span class="w-bottom-sheet__stat-value" style="color: var(--w-color-success);">3<sup style="font-size:0.5em">e</sup></span>
      </div>
      <div class="w-bottom-sheet__stat">
        <span class="w-bottom-sheet__stat-label">Elo</span>
        <span class="w-bottom-sheet__stat-value">1582</span>
        <div class="w-bottom-sheet__elo-gauge">
          <div class="w-bottom-sheet__elo-fill" style="width: 72%;"></div>
        </div>
      </div>
      <div class="w-bottom-sheet__stat">
        <span class="w-bottom-sheet__stat-label">Confiance</span>
        <span class="w-bottom-sheet__stat-value" style="color: var(--w-color-success);">74<sup style="font-size:0.5em">%</sup></span>
        <span class="w-bottom-sheet__stat-sub">Elevee</span>
      </div>
      <div class="w-bottom-sheet__stat">
        <span class="w-bottom-sheet__stat-label">Forme</span>
        <div class="w-bottom-sheet__form-dots">
          <span class="w-bottom-sheet__form-dot w-bottom-sheet__form-dot--W">V</span>
          <span class="w-bottom-sheet__form-dot w-bottom-sheet__form-dot--W">V</span>
          <span class="w-bottom-sheet__form-dot w-bottom-sheet__form-dot--L">D</span>
          <span class="w-bottom-sheet__form-dot w-bottom-sheet__form-dot--W">V</span>
          <span class="w-bottom-sheet__form-dot w-bottom-sheet__form-dot--D">N</span>
        </div>
      </div>
      <div class="w-bottom-sheet__stat">
        <span class="w-bottom-sheet__stat-label">Tendance</span>
        <span class="w-bottom-sheet__stat-value w-bottom-sheet__trend--up">&uarr;</span>
        <span class="w-bottom-sheet__stat-sub">En hausse</span>
      </div>
    </div>

    <!-- Zone probabilities -->
    <div class="w-bottom-sheet__zones">
      <p class="w-bottom-sheet__section-label">Probabilites par zone</p>
      <div class="w-bottom-sheet__zone-bar" role="img" aria-label="Demi-finales 35%, Phases finales 40%, Milieu 20%, Relegation 5%">
        <div class="w-bottom-sheet__zone-segment" style="flex: 35; background: var(--w-color-europe);">35%</div>
        <div class="w-bottom-sheet__zone-segment" style="flex: 40; background: var(--w-color-top6);">40%</div>
        <div class="w-bottom-sheet__zone-segment" style="flex: 20; background: var(--w-color-mid);">20%</div>
        <div class="w-bottom-sheet__zone-segment" style="flex: 5; background: var(--w-color-relegation);">5%</div>
      </div>
      <div class="w-bottom-sheet__zone-legend">
        <span class="w-bottom-sheet__zone-item"><span class="w-bottom-sheet__zone-dot" style="background: var(--w-color-europe);"></span> Demi-finales 35%</span>
        <span class="w-bottom-sheet__zone-item"><span class="w-bottom-sheet__zone-dot" style="background: var(--w-color-top6);"></span> Phases finales 40%</span>
        <span class="w-bottom-sheet__zone-item"><span class="w-bottom-sheet__zone-dot" style="background: var(--w-color-mid);"></span> Milieu 20%</span>
        <span class="w-bottom-sheet__zone-item"><span class="w-bottom-sheet__zone-dot" style="background: var(--w-color-relegation);"></span> Relegation 5%</span>
      </div>
    </div>
  </div>
</dialog>

<script>
const sheet = document.getElementById('sheet');
const openBtn = document.getElementById('openBtn');
const closeBtn = document.getElementById('closeBtn');
const handle = sheet.querySelector('.w-bottom-sheet__handle');

let startY = 0;
let currentY = 0;
let isDragging = false;

// Open
openBtn.addEventListener('click', () => {
  sheet.showModal();
  // Start at half height
  requestAnimationFrame(() => {
    sheet.classList.add('w-bottom-sheet--half');
    // Animate to half
    requestAnimationFrame(() => {
      sheet.classList.remove('w-bottom-sheet--half');
    });
  });
});

// Close with animation
function closeSheet() {
  sheet.classList.add('w-bottom-sheet--closing');
  const fallback = setTimeout(() => {
    sheet.classList.remove('w-bottom-sheet--closing');
    sheet.close();
  }, 220);

  sheet.addEventListener('transitionend', function handler() {
    clearTimeout(fallback);
    sheet.removeEventListener('transitionend', handler);
    sheet.classList.remove('w-bottom-sheet--closing');
    sheet.close();
  }, { once: true });
}

closeBtn.addEventListener('click', closeSheet);

// Backdrop click
sheet.addEventListener('click', (e) => {
  if (e.target === sheet) closeSheet();
});

// Drag on handle
handle.addEventListener('touchstart', (e) => {
  isDragging = true;
  startY = e.touches[0].clientY;
  currentY = 0;
  sheet.style.transition = 'none';
}, { passive: false });

handle.addEventListener('touchmove', (e) => {
  if (!isDragging) return;
  e.preventDefault();
  const delta = e.touches[0].clientY - startY;
  if (delta > 0) {
    currentY = delta;
    sheet.style.transform = `translateY(${delta}px)`;
  }
}, { passive: false });

handle.addEventListener('touchend', () => {
  if (!isDragging) return;
  isDragging = false;
  sheet.style.transition = '';
  if (currentY > 120) {
    closeSheet();
  } else {
    sheet.style.transform = '';
  }
});

// Escape key (native dialog already handles this, but we want animation)
sheet.addEventListener('cancel', (e) => {
  e.preventDefault();
  closeSheet();
});
</script>

</body>
</html>
