<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whistle — Empty State Variante C (Illustration Ludique)</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ===== Reset & Base ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: "Nunito", sans-serif;
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.5;
      color: #1f2937;
      background-color: #faf8f5;
      -webkit-font-smoothing: antialiased;
    }

    #app {
      max-width: 430px;
      margin: 0 auto;
      padding: 0 1rem;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ===== VARIANTE C — Illustration Ludique ===== */
    /* Approche : Grande illustration SVG d'un terrain de rugby stylise
       avec le sifflet au centre. Ton leger et ludique.
       Message avec un sous-texte explicatif. Fond clair. */

    .w-empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem 1rem;
      text-align: center;
    }

    /* SVG illustration — terrain + sifflet */
    .w-empty-state__illustration {
      width: 160px;
      height: 160px;
      position: relative;
    }

    /* Pulsating ring behind the illustration */
    .w-empty-state__illustration::before {
      content: "";
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 2px dashed rgba(109, 40, 217, 0.15);
    }

    .w-empty-state__illustration svg {
      width: 100%;
      height: 100%;
    }

    .w-empty-state__text {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .w-empty-state__title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #1f2937;
      letter-spacing: -0.02em;
    }

    .w-empty-state__message {
      font-size: 1.125rem;
      font-weight: 700;
      color: #6d28d9;
    }

    .w-empty-state__sub {
      font-size: 0.875rem;
      font-weight: 400;
      color: #9ca3af;
      max-width: 260px;
      margin: 0 auto;
    }

    /* ===== STALE INDICATOR ===== */
    /* Variante C : bandeau subtil avec icone horloge */
    .w-stale-demo {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid #e5e7eb;
      width: 100%;
    }

    .w-stale-demo__label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .w-score-card-stub {
      background: linear-gradient(145deg, #7c3aed 0%, #6d28d9 40%, #5b21b6 100%);
      border-radius: 16px;
      color: #fff;
      padding: 1.5rem;
      box-shadow: 0 4px 20px rgba(109, 40, 217, 0.3);
    }

    .w-score-card-stub h2 {
      font-size: 1.5rem;
      font-weight: 800;
    }

    .w-stale-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      margin-top: 8px;
      font-size: 0.8125rem;
      font-weight: 600;
      color: #6b7280;
      background: #f3f4f6;
      border-radius: 8px;
    }

    .w-stale-indicator svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: #9ca3af;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="app">

    <!-- ============================== -->
    <!-- EMPTY STATE — Variante C       -->
    <!-- Illustration ludique           -->
    <!-- ============================== -->
    <div class="w-empty-state">
      <div class="w-empty-state__illustration">
        <svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
          <!-- Fond cercle -->
          <circle cx="80" cy="80" r="72" fill="#f3e8ff" />

          <!-- Terrain de rugby stylise -->
          <rect x="40" y="50" width="80" height="55" rx="4" fill="#e9d5ff" stroke="#c4b5fd" stroke-width="1.5"/>
          <!-- Ligne mediane -->
          <line x1="80" y1="50" x2="80" y2="105" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="3 2"/>
          <!-- Cercle central -->
          <circle cx="80" cy="77.5" r="10" fill="none" stroke="#c4b5fd" stroke-width="1"/>

          <!-- Ballon de rugby -->
          <g transform="translate(80, 77.5) rotate(-30)">
            <ellipse rx="14" ry="8" fill="#6d28d9" />
            <line x1="-8" y1="0" x2="8" y2="0" stroke="#fff" stroke-width="1.2"/>
            <line x1="-4" y1="-3" x2="-4" y2="3" stroke="#fff" stroke-width="0.8"/>
            <line x1="0" y1="-4.5" x2="0" y2="4.5" stroke="#fff" stroke-width="0.8"/>
            <line x1="4" y1="-3" x2="4" y2="3" stroke="#fff" stroke-width="0.8"/>
          </g>

          <!-- Petites etoiles / etincelles -->
          <circle cx="115" cy="45" r="2" fill="#c4b5fd" opacity="0.6"/>
          <circle cx="50" cy="42" r="1.5" fill="#c4b5fd" opacity="0.4"/>
          <circle cx="125" cy="70" r="1.5" fill="#c4b5fd" opacity="0.5"/>

          <!-- Zzz (dormant) -->
          <text x="108" y="42" font-family="Nunito, sans-serif" font-weight="800" font-size="12" fill="#a78bfa" opacity="0.7">z</text>
          <text x="118" y="35" font-family="Nunito, sans-serif" font-weight="800" font-size="14" fill="#a78bfa" opacity="0.5">z</text>
          <text x="126" y="26" font-family="Nunito, sans-serif" font-weight="800" font-size="10" fill="#a78bfa" opacity="0.3">z</text>
        </svg>
      </div>

      <div class="w-empty-state__text">
        <h1 class="w-empty-state__title">Whistle</h1>
        <p class="w-empty-state__message">Les donnees arrivent lundi</p>
        <p class="w-empty-state__sub">Le modele dort entre les journees de championnat</p>
      </div>
    </div>

    <!-- ============================== -->
    <!-- STALE INDICATOR demo           -->
    <!-- Variante C : bandeau gris      -->
    <!-- avec icone horloge             -->
    <!-- ============================== -->
    <div class="w-stale-demo">
      <p class="w-stale-demo__label">Indicateur stale (sous la score card) :</p>
      <div class="w-score-card-stub">
        <h2>Stade Rochelais</h2>
      </div>
      <div class="w-stale-indicator">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        Derniere mise a jour : lundi 17 mars
      </div>
    </div>

  </div>
</body>
</html>
