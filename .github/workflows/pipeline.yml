name: Pipeline TOP 14

on:
  schedule:
    # Lundi, mardi, mercredi a 6h UTC (8h heure francaise)
    - cron: '0 6 * * 1,2,3'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Step 1: Scrape LNR (primary source)
      - name: Scrape LNR
        id: scrape_lnr
        continue-on-error: true
        run: node scripts/scrape.js

      # Step 2: Fallback to API-Sports if LNR fails
      - name: Scrape fallback (API-Sports)
        if: steps.scrape_lnr.outcome == 'failure'
        id: scrape_fallback
        run: SCRAPE_SOURCE=api-sports node scripts/scrape.js

      # Step 3: Fail pipeline if both scraping sources failed
      - name: Check scraping result
        if: steps.scrape_lnr.outcome == 'failure' && steps.scrape_fallback.outcome == 'failure'
        run: |
          echo "::error::Both LNR and API-Sports scraping failed"
          exit 1

      # Step 4: Validate scraped data
      - name: Validate data
        run: node scripts/validate.js

      # Step 5: Compute Elo ratings and projections
      - name: Compute Elo
        run: node scripts/elo.js

      # Step 6: Generate season JSON
      - name: Generate JSON
        run: node scripts/generate.js

      # Step 7: Commit and push updated data
      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/2025-2026.json data/seasons.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          MATCHDAY=$(node -e "import('node:fs').then(fs => { const d = JSON.parse(fs.readFileSync('data/2025-2026.json', 'utf-8')); console.log(d.currentMatchday || 'unknown'); })")
          git commit -m "chore: mise a jour donnees journee $MATCHDAY"
          git push

      # Step 8: Alert on consecutive failures
      - name: Check consecutive failures and alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Count consecutive failures from last 3 runs (excluding current)
          FAILURES=$(gh run list --workflow=pipeline.yml --limit=3 --json conclusion -q '[.[].conclusion] | map(select(. == "failure")) | length')
          echo "Recent failures (including current): $FAILURES"

          if [ "$FAILURES" -ge 2 ]; then
            echo "3+ consecutive failures detected (2 previous + current). Creating issue..."

            # Check for existing open issue to avoid duplicates
            EXISTING=$(gh issue list --label "pipeline-failure" --state open --json number -q 'length')

            if [ "$EXISTING" -eq 0 ]; then
              # Ensure the label exists
              gh label create "pipeline-failure" --color "d73a4a" --description "Pipeline consecutive failures" 2>/dev/null || true

              gh issue create \
                --title "Pipeline TOP 14 : 3 echecs consecutifs" \
                --label "pipeline-failure" \
                --body "## Pipeline en echec

          Le pipeline TOP 14 a echoue 3 fois consecutives.

          **Date :** $(date -u '+%Y-%m-%d %H:%M UTC')
          **Workflow :** ${{ github.workflow }}
          **Run :** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### Actions recommandees

          1. Verifier les logs du dernier run
          2. Tester manuellement \`node scripts/scrape.js\` pour verifier si le site LNR est accessible
          3. Si le probleme persiste, verifier les sources de donnees alternatives

          ---
          *Issue creee automatiquement par le pipeline GitHub Actions.*"
            else
              echo "Open pipeline-failure issue already exists. Skipping creation."
            fi
          fi
